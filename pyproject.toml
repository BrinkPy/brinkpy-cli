[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "brinkpy"
version = "0.1.2"
description = "Brinkpy CLI for reliability analysis, design optimization, and simulation."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{name = "Cesar Carrasco"}]
requires-python = ">=3.10"
dependencies = [
  "typer>=0.9.0",
  "rich>=13.0.0",
  "requests>=2.31.0",
  "numpy>=1.24.0",
  "matplotlib>=3.7.0",
  "pydantic>=2.0.0",
  "typing_extensions>=4.7.0",
  "filedialpy>=0.1.0",
  "platformdirs>=3.0.0",
  "python-dotenv>=1.0.0",
  "PyJWT>=2.0.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Development tools: building and checking releases, and the docs site.
# The docs packages match requirements-docs.txt, which Cloudflare Pages uses.
dev = [
  "build>=1.0.0",
  "twine>=5.0.0",
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.5",
  "pymdown-extensions>=10.20.1",
]

[project.scripts]
brinkpy = "brinkpy.brinkpy:app"

[project.urls]
Homepage = "https://brinkpy.app"
Documentation = "https://brinkpy.app"
Repository = "https://github.com/BrinkPy/brinkpy-cli"

[tool.hatch.build.targets.wheel]
packages = ["brinkpy"]
include = [
  "brinkpy/examples/**",
]

[tool.hatch.build.targets.sdist]
include = [
  "brinkpy/**",
  "brinkpy/examples/**",
  "README.md",
]
